<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ClassFlow">
<meta name="theme-color" content="#172420">
<title>ClassFlow | سجل الطلبات</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="iconsteacher/icon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="iconsteacher/icon-180.png">
<link rel="apple-touch-icon" sizes="167x167" href="iconsteacher/icon-167.png">
<link rel="apple-touch-icon" sizes="152x152" href="iconsteacher/icon-152.png">
<link rel="icon" type="image/png" sizes="192x192" href="iconsteacher/icon-192.png">

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;600;700;800&family=Cairo:wght@500;600;700;800&family=Heebo:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" rel="stylesheet">

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  /* Chalkboard */
  --board: #172420;
  --board-deep: #0F1A17;
  --chalk-line: rgba(237, 230, 214, 0.09);

  /* Index card (pinned paper) */
  --card: #F3ECDC;
  --card-shadow: rgba(0, 0, 0, 0.35);
  --ink: #2B2620;
  --ink-sub: #6B6255;
  --ink-faint: #A69C89;

  /* Accents */
  --ochre: #C08A2E;
  --ochre-bg: rgba(192, 138, 46, 0.12);
  --sage: #4C7A5E;
  --sage-bg: rgba(76, 122, 94, 0.14);
  --brick: #A24A42;
  --brick-bg: rgba(162, 74, 66, 0.12);
  --pin: #B5453D;

  --radius-card: 3px;
}

body {
  font-family: 'Heebo', 'Cairo', sans-serif;
  background-color: var(--board);
  background-image:
    radial-gradient(circle at 1px 1px, rgba(237,230,214,0.05) 1px, transparent 0);
  background-size: 22px 22px;
  color: var(--chalk-line);
  min-height: 100vh;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

@keyframes riseIn { from { opacity: 0; transform: translateY(8px) rotate(var(--tilt, 0deg)); } to { opacity: 1; transform: translateY(0) rotate(var(--tilt, 0deg)); } }
@keyframes spin { to { transform: rotate(360deg); } }
.rise-in { animation: riseIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

/* ── LAYOUT ── */
#app {
  display: block;
  max-width: 600px;
  margin: 0 auto;
  padding: calc(1.5rem + env(safe-area-inset-top)) 1rem calc(3rem + env(safe-area-inset-bottom)) 1rem;
}

/* Header: chalk nameplate */
.header {
  padding: 0 0.25rem 1.1rem 0.25rem;
  margin-bottom: 1.4rem;
  border-bottom: 1px dashed var(--chalk-line);
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 12px;
}
.h-left { display: flex; align-items: center; gap: 14px; }
.h-seal {
  width: 46px;
  height: 46px;
  border: 2px solid #D8CFBB;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Rubik', 'Cairo', sans-serif;
  font-weight: 700;
  font-size: 1.2rem;
  color: #EDE6D6;
  flex-shrink: 0;
  opacity: 0.9;
}
.h-title {
  font-family: 'Rubik', 'Cairo', sans-serif;
  font-size: 1.5rem;
  font-weight: 700;
  color: #EDE6D6;
  letter-spacing: -0.01em;
}
.h-sub {
  font-size: 0.72rem;
  color: #8A9690;
  display: flex;
  align-items: center;
  gap: 6px;
  margin-top: 3px;
  font-family: 'Space Mono', monospace;
  letter-spacing: 0.02em;
}
.sync-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-faint); transition: background 0.3s; }
.refresh-btn {
  background: transparent;
  border: 1px solid var(--chalk-line);
  border-radius: 50%;
  width: 44px;
  height: 44px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  color: #EDE6D6;
  transition: all 0.2s ease;
  -webkit-tap-highlight-color: transparent;
}
.refresh-btn:hover { background: rgba(237, 230, 214, 0.06); border-color: rgba(237,230,214,0.25); }
.refresh-btn:active { transform: scale(0.92); }
.refresh-btn.spin .material-symbols-rounded { animation: spin 0.8s linear infinite; }
.refresh-btn .material-symbols-rounded { font-size: 20px; }

/* Tabs: folder-tab style, underline indicator */
.tabs {
  display: flex;
  gap: 6px;
  margin-bottom: 1.5rem;
  border-bottom: 1px solid var(--chalk-line);
}
.tab {
  position: relative;
  padding: 10px 4px;
  margin-left: 22px;
  min-height: 44px;
  display: flex;
  align-items: center;
  font-family: 'Rubik', 'Cairo', sans-serif;
  font-size: 0.98rem;
  font-weight: 600;
  color: #7C8983;
  cursor: pointer;
  transition: color 0.2s ease;
  -webkit-tap-highlight-color: transparent;
}
.tab:first-child { margin-left: 0; }
.tab.active { color: #EDE6D6; }
.tab.active::after {
  content: '';
  position: absolute;
  left: 0; right: 0; bottom: -1px;
  height: 2px;
  background: var(--ochre);
}
.tab .badge {
  margin-inline-start: 7px;
  background: var(--ochre);
  color: #1B140A;
  font-family: 'Space Mono', monospace;
  font-size: 0.68rem;
  font-weight: 700;
  border-radius: 99px;
  padding: 1px 7px;
  line-height: 1.5;
}

/* Cards List */
.list { display: flex; flex-direction: column; gap: 22px; }
.empty {
  text-align: center;
  padding: 4rem 1.5rem;
  color: #7C8983;
  border: 1px dashed var(--chalk-line);
  border-radius: var(--radius-card);
}
.empty .material-symbols-rounded { font-size: 2.4rem; margin-bottom: 0.6rem; opacity: 0.6; color: #EDE6D6; }
.empty p { font-family: 'Rubik', 'Cairo', sans-serif; font-size: 1.05rem; }

/* Index card, pinned to the board */
.card {
  --tilt: -0.35deg;
  position: relative;
  background: var(--card);
  color: var(--ink);
  border-radius: var(--radius-card);
  padding: 1.4rem 1.15rem 1.15rem 1.15rem;
  box-shadow: 0 10px 22px var(--card-shadow), 0 1px 0 rgba(255,255,255,0.4) inset;
  transform: rotate(var(--tilt));
}
.card:nth-child(even) { --tilt: 0.4deg; }
.card::before {
  /* pin */
  content: '';
  position: absolute;
  top: -7px;
  right: 50%;
  transform: translateX(50%);
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #E38078, var(--pin) 70%);
  box-shadow: 0 2px 3px rgba(0,0,0,0.4);
}
.card.cancelled { opacity: 0.68; }

.c-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 0.15rem; flex-wrap: wrap; }
.c-name { font-family: 'Rubik', 'Cairo', sans-serif; font-size: 1.2rem; font-weight: 700; color: var(--ink); word-break: break-word; }
.c-meta { font-size: 0.76rem; color: var(--ink-sub); margin-top: 2px; }

/* Stamp */
.c-status {
  flex-shrink: 0;
  white-space: nowrap;
  font-family: 'Space Mono', monospace;
  font-size: 0.62rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.09em;
  padding: 4px 9px;
  border-radius: 4px;
  border: 1.5px solid currentColor;
  transform: rotate(-4deg);
  display: inline-block;
}
.c-status.pending { color: var(--ochre); background: var(--ochre-bg); }
.c-status.approved { color: var(--sage); background: var(--sage-bg); }
.c-status.cancelled { color: var(--brick); background: var(--brick-bg); transform: rotate(-6deg); }

.c-divider {
  border-top: 1px dashed rgba(43,38,32,0.18);
  margin: 0.75rem 0 0.7rem 0;
}

.c-info-grid { display: grid; gap: 7px; font-size: 0.86rem; color: var(--ink-sub); }
.c-row { display: flex; align-items: center; gap: 7px; }
.c-row .material-symbols-rounded { font-size: 17px; color: var(--sage); }
.c-row .stamp-time { font-family: 'Space Mono', monospace; color: var(--ink); font-weight: 700; }

.c-notes {
  margin-top: 9px;
  background: rgba(43,38,32,0.05);
  border-right: 3px solid var(--ink-faint);
  border-radius: 2px;
  padding: 7px 11px;
  font-size: 0.82rem;
  color: var(--ink-sub);
  font-style: italic;
  overflow-wrap: anywhere;
  word-break: break-word;
}

.c-actions { display: flex; gap: 10px; margin-top: 1.15rem; }
.btn {
  flex: 1;
  min-height: 46px;
  background: transparent;
  border: 1.5px solid var(--ink);
  border-radius: 3px;
  padding: 10px 8px;
  font-size: 0.86rem;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  font-family: 'Heebo', 'Cairo', sans-serif;
  color: var(--ink);
  transition: all 0.15s ease;
  -webkit-tap-highlight-color: transparent;
  white-space: nowrap;
}
.btn:active { transform: scale(0.96); }
.btn .material-symbols-rounded { font-size: 18px; }

.btn-approve { border-color: var(--sage); color: var(--sage); }
.btn-approve:hover { background: var(--sage-bg); }

.btn-reject { border-color: var(--brick); color: var(--brick); }
.btn-reject:hover { background: var(--brick-bg); }

/* Memo box for approved messages */
.msg-box {
  margin-top: 1rem;
  background: repeating-linear-gradient(var(--card), var(--card) 27px, rgba(43,38,32,0.08) 28px);
  border: 1px solid rgba(43,38,32,0.15);
  border-radius: 2px;
  padding: 0.9rem 0.9rem 0.7rem 0.9rem;
}
.msg-box textarea {
  width: 100%;
  background: transparent;
  border: none;
  font-family: 'Heebo', 'Cairo', sans-serif;
  font-size: 16px;
  line-height: 27px;
  color: var(--ink);
  resize: vertical;
  min-height: 108px;
  outline: none;
}
.email-inp {
  width: 100%;
  background: rgba(255,255,255,0.5);
  border: 1px solid rgba(43,38,32,0.18);
  border-radius: 2px;
  padding: 9px 10px;
  font-size: 16px;
  min-height: 44px;
  margin-top: 6px;
  font-family: 'Heebo', 'Cairo', sans-serif;
  color: var(--ink);
  outline: none;
}
.email-inp:focus { border-color: var(--sage); }
.send-row { display: flex; gap: 8px; margin-top: 10px; }
.btn-wa { border-color: #2E7D5B; color: #2E7D5B; }
.btn-wa:hover { background: rgba(46,125,91,0.1); }
.btn-mail { border-color: var(--ink-sub); color: var(--ink-sub); }
.btn-mail:hover { background: rgba(43,38,32,0.06); }

/* Toast — chalk announcement */
#toast {
  position: fixed;
  bottom: calc(24px + env(safe-area-inset-bottom));
  left: 50%;
  max-width: calc(100vw - 2rem);
  transform: translateX(-50%) translateY(40px);
  background: #EDE6D6;
  color: var(--ink);
  border: 1px solid rgba(43,38,32,0.15);
  padding: 11px 22px;
  border-radius: 3px;
  font-size: 0.85rem;
  font-weight: 600;
  text-align: center;
  opacity: 0;
  transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  z-index: 9999;
  pointer-events: none;
  box-shadow: 0 10px 24px rgba(0,0,0,0.45);
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

@media (max-width: 380px) {
  #app { padding-left: 0.75rem; padding-right: 0.75rem; }
  .h-title { font-size: 1.25rem; }
  .card { padding: 1.2rem 0.9rem 1rem 0.9rem; }
  .c-actions, .send-row { flex-wrap: wrap; }
  .c-actions .btn, .send-row .btn { flex: 1 1 100%; }
}
</style>
</head>
<body>

<div id="toast"></div>

<!-- MAIN CONTAINER -->
<div id="app">
 <div class="header">
  <div class="h-left">
   <div class="h-seal">C</div>
   <div>
    <div class="h-title">سجل الطلبات</div>
    <div class="h-sub">
      <span class="sync-dot" id="sync-dot"></span>
      <span id="sync-text">מתחבר...</span>
    </div>
   </div>
  </div>
  <button class="refresh-btn" id="refresh-btn" onclick="loadAll(true)" title="רענון">
   <span class="material-symbols-rounded">refresh</span>
  </button>
 </div>

 <div class="tabs">
  <div class="tab active" id="tab-pending" onclick="setTab('pending')">
    ממתינות <span class="badge" id="pending-badge" style="display:none"></span>
  </div>
  <div class="tab" id="tab-all" onclick="setTab('all')">כל הבקשות</div>
 </div>

 <div class="list" id="list"></div>
</div>

<script>
// ══════════════════════════════════════════════════════
// DATA & SHEETS INTEGRATION
// ══════════════════════════════════════════════════════
const SHEETS_URL  = 'https://script.google.com/macros/s/AKfycbyprj2wfR4gOeSnzEddcFoQ1tWOlDnzo9IAd9JR1JHe58mwPTi_jVUOPADzRFUZl7QA/exec';
const SHEETS_PASS = 'classflow2024';

const STORE = {
 getItem(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
 setItem(k,v){ try{ localStorage.setItem(k,String(v)); }catch(e){} }
};

async function DB_post(payload){
 payload.pass = SHEETS_PASS;
 try{
  const res = await fetch(SHEETS_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});
  return await res.json().catch(()=>({ok:true}));
 }catch(e){
  try{ await fetch(SHEETS_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)}); return {ok:true,fallback:true}; }
  catch(e2){ return {ok:false,error:e2.message}; }
 }
}

async function DB_get(sheet){
 const controller = new AbortController();
 const timer = setTimeout(()=>controller.abort(),9000);
 try{
  const res = await fetch(SHEETS_URL+'?sheet='+encodeURIComponent(sheet)+'&pass='+encodeURIComponent(SHEETS_PASS)+'&t='+Date.now(),{signal:controller.signal});
  clearTimeout(timer);
  if(!res.ok) return null;
  const data = await res.json();
  return Array.isArray(data)?data:null;
 }catch(e){ clearTimeout(timer); return null; }
}

function rowToObj(headers,row){
 const HEADER_MAP={language:'lang',lessons_bought:'bought',start_date:'startDate',package_id:'packageId',
  is_active:'isActive',late_count:'lateCount',cancel_count:'cancelCount',created_at:'createdAt',
  updated_at:'updatedAt',student_id:'studentId',student_name:'studentName',teacher_notes:'teacherNotes',
  booking_id:'bookingId',free_text:'freeText'};
 const obj={};
 headers.forEach((h,i)=>{ const key=HEADER_MAP[h]||h; obj[key]=row[i]??''; });
 return obj;
}

function normalizeStatus(status){
 const s=String(status||'pending').trim();
 if(['pending','approved','cancelled'].includes(s)) return s;
 if(['ממתין','ממתינה','בהמתנה','מחכה','منتظر','معلق'].includes(s)) return 'pending';
 if(['מאושר','אושר','מאושרת','موافق','تمت الموافقة'].includes(s)) return 'approved';
 if(['בוטל','מבוטל','נדחה','בוטלה','ملغي','مرفوض'].includes(s)) return 'cancelled';
 return 'pending';
}

function escHtml(v){ return String(v??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch])); }
function escJs(v){ return String(v??'').replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\r?\n/g,' '); }
function normPhone(p){ return p?String(p).replace(/\D/g,''):''; }
function samePhone(a,b){ if(!a||!b) return false; return normPhone(a).slice(-9)===normPhone(b).slice(-9); }

function fmtDate(d){
 if(!d) return '';
 const dt=new Date(d);
 if(isNaN(dt)) return d;
 return dt.getDate()+'/'+(dt.getMonth()+1)+'/'+dt.getFullYear();
}

// دالة إصلاح تنسيق الوقت لعرض HH:MM فقط
function fmtTime(t){
 if(!t) return '';
 const str = String(t).trim();
 if (str.includes('T')) {
  const dt = new Date(str);
  if (!isNaN(dt)) {
   const hh = String(dt.getHours()).padStart(2, '0');
   const mm = String(dt.getMinutes()).padStart(2, '0');
   return `${hh}:${mm}`;
  }
 }
 const match = str.match(/(\d{1,2}):(\d{2})/);
 if (match) {
  return `${match[1].padStart(2, '0')}:${match[2]}`;
 }
 return str;
}

const DEFAULT_MSG_TEMPLATES = {
 he: `שלום {name} 😊\nהשיעור שלך אושר ✅\n📅 תאריך: {date}\n🕐 שעה: {time}\nנתראה בקרוב!`,
 ar: `مرحباً {name} 😊\nتم تأكيد درسك ✅\n📅 التاريخ: {date}\n🕐 الساعة: {time}\nأراك قريباً!`
};

let msgSettings = { enabled:true, lang:'both', templateHe:DEFAULT_MSG_TEMPLATES.he, templateAr:DEFAULT_MSG_TEMPLATES.ar };
let teacherProfile = {};
let avDefaults = { lessonDuration:60, defaultRate:150 };

function fillTemplate(tpl,name,date,time){
 return String(tpl||'').replace(/\{name\}/g,name||'').replace(/\{date\}/g,date||'').replace(/\{time\}/g,time||'');
}

function buildApprovalMessage(name,dateStr,timeStr){
 const formattedTime = fmtTime(timeStr);
 const heMsg=fillTemplate(msgSettings.templateHe,name,dateStr,formattedTime);
 const arMsg=fillTemplate(msgSettings.templateAr,name,dateStr,formattedTime);
 if(msgSettings.lang==='he') return heMsg;
 if(msgSettings.lang==='ar') return arMsg;
 return heMsg+'\n\n'+arMsg;
}

// ══════════════════════════════════════════════════════
// APP CONTROLLER
// ══════════════════════════════════════════════════════
let bookings=[], students=[], lessons=[];
let currentTab='pending';

function setSyncStatus(state){
 const dot=document.getElementById('sync-dot'), txt=document.getElementById('sync-text');
 const map={ok:{c:'#4C7A5E',t:'מסונכרן'},syncing:{c:'#C08A2E',t:'מסנכרן...'},offline:{c:'#A24A42',t:'אין חיבור'}};
 const s=map[state]||map.ok;
 dot.style.background=s.c; txt.textContent=s.t;
}

window.addEventListener('DOMContentLoaded', () => {
 initApp();
});

async function initApp(){
 await loadAll(false);
 setInterval(()=>loadAll(false), 30000);
}

async function loadAll(manual){
 const btn=document.getElementById('refresh-btn');
 if(manual && btn) btn.classList.add('spin');
 setSyncStatus('syncing');
 try{
  const [bkgRows, studentRows, lessonRows, jsonRows] = await Promise.all([
   DB_get('Bookings'), DB_get('Students'), DB_get('Lessons'), DB_get('JsonStore')
  ]);

  if(bkgRows && bkgRows.length>1){
   const h=bkgRows[0];
   bookings = bkgRows.slice(1).filter(r=>r[0]!=='').map(r=>{
    const o=rowToObj(h,r); o.status=normalizeStatus(o.status); return o;
   });
  } else bookings=[];

  if(studentRows && studentRows.length>1){
   const h=studentRows[0];
   students = studentRows.slice(1).filter(r=>r[0]!=='').map(r=>rowToObj(h,r));
  } else students=[];

  if(lessonRows && lessonRows.length>1){
   const h=lessonRows[0];
   lessons = lessonRows.slice(1).filter(r=>r[0]!=='').map(r=>rowToObj(h,r));
  } else lessons=[];

  if(jsonRows && jsonRows.length>1){
   const store={};
   jsonRows.slice(1).forEach(r=>{ if(r[0]){ try{ store[r[0]]=JSON.parse(r[1]||'null'); }catch(e){} } });
   if(store.msgSettings) msgSettings={...msgSettings,...store.msgSettings};
   if(store.teacherProfile) teacherProfile=store.teacherProfile;
   if(store.availability){ avDefaults.lessonDuration=store.availability.lessonDuration||60; avDefaults.defaultRate=store.availability.defaultRate||150; }
  }

  setSyncStatus('ok');
 }catch(e){
  setSyncStatus('offline');
  toast('⚠️ שגיאת חיבור');
 }
 if(manual && btn) setTimeout(()=>btn.classList.remove('spin'),400);
 renderList();
}

function setTab(t){
 currentTab=t;
 document.getElementById('tab-pending').classList.toggle('active',t==='pending');
 document.getElementById('tab-all').classList.toggle('active',t==='all');
 renderList();
}

// ترتيب حسب "الأحدث أولاً": الطلبات الجديدة (ID أعلى) تظهر برأس القائمة
function newestFirst(a,b){
 const ai = parseInt(a.id), bi = parseInt(b.id);
 if(!isNaN(ai) && !isNaN(bi) && ai!==bi) return bi-ai;
 // fallback لو الـ id مش رقمي: قارن بالتاريخ+الوقت تنازلياً
 return (b.date+b.time).localeCompare(a.date+a.time);
}

function renderList(){
 const pending = bookings.filter(b=>b.status==='pending');
 const badge = document.getElementById('pending-badge');
 if(pending.length>0){ badge.style.display='inline-block'; badge.textContent=pending.length; } else badge.style.display='none';

 let rows;
 if(currentTab==='pending'){
  rows = pending.slice().sort(newestFirst);
 } else {
  // كل الطلبات: الجديدة أولاً في رأس القائمة، بغض النظر عن حالتها
  rows = bookings.slice().sort(newestFirst);
 }

 const list=document.getElementById('list');
 if(!rows.length){
  list.innerHTML=`<div class="empty rise-in">
   <span class="material-symbols-rounded">check_circle</span>
   <p>אין בקשות ${currentTab==='pending'?'ממתינות':''} כרגע</p>
  </div>`;
  return;
 }

 list.innerHTML = rows.map(b=>{
  const statusLabel = b.status==='approved'?'מאושר':b.status==='pending'?'ממתין':'בוטל';
  const cleanTime = fmtTime(b.time);
  return `
  <div class="card rise-in ${b.status}" id="card-${escHtml(b.id)}">
   <div class="c-top">
    <div>
     <div class="c-name">${escHtml(b.name)}</div>
     <div class="c-meta">${escHtml(b.lang||'')}</div>
    </div>
    <div class="c-status ${b.status}">${statusLabel}</div>
   </div>
   <div class="c-divider"></div>
   <div class="c-info-grid">
     <div class="c-row"><span class="material-symbols-rounded">calendar_month</span> <span class="stamp-time">${fmtDate(b.date)} · ${escHtml(cleanTime)}</span></div>
     ${b.phone?`<div class="c-row"><span class="material-symbols-rounded">call</span> ${escHtml(b.phone)}</div>`:''}
   </div>
   ${b.notes?`<div class="c-notes">${escHtml(b.notes)}</div>`:''}
   ${b.status==='pending' ? `
   <div class="c-actions">
    <button class="btn btn-approve" onclick="approveBooking('${escJs(b.id)}')">
     <span class="material-symbols-rounded">check</span> موافقة
    </button>
    <button class="btn btn-reject" onclick="rejectBooking('${escJs(b.id)}')">
     <span class="material-symbols-rounded">close</span> رفض
    </button>
   </div>` : ''}
   ${b.status==='approved' ? `
   <div class="msg-box" id="msgbox-${escHtml(b.id)}">
    <textarea id="msgtext-${escHtml(b.id)}">${escHtml(buildApprovalMessage(b.name,fmtDate(b.date),b.time))}</textarea>
    <input class="email-inp" type="email" id="email-${escHtml(b.id)}" placeholder="אימייל התלמיד (אופציונלי)">
    <div class="send-row">
     <button class="btn btn-wa" ${b.phone?'':'disabled'} onclick="sendWA('${escJs(b.id)}','${escJs(b.phone)}')">
      <span class="material-symbols-rounded">chat</span> واتساب
     </button>
     <button class="btn btn-mail" onclick="sendMail('${escJs(b.id)}','${escJs(b.name)}')">
      <span class="material-symbols-rounded">mail</span> إيميل
     </button>
    </div>
   </div>` : ''}
  </div>`;
 }).join('');
}

// ACTIONS
// ══════════════════════════════════════════════════════
async function approveBooking(id){
 const b = bookings.find(x=>String(x.id)===String(id));
 if(!b) return;
 b.status='approved';
 renderList();
 toast('מאשר...');

 await DB_post({action:'updateBookingStatus', sheet:'Bookings', id:String(id), status:'approved'});

 let s = students.find(x=>samePhone(x.phone,b.phone));
 if(!s){
  const maxSid = students.reduce((m,x)=>Math.max(m,parseInt(x.id)||0),0);
  s = { id:maxSid+1, name:b.name, phone:b.phone||'', lang:b.lang||'', level:'מתחיל',
        rate:avDefaults.defaultRate||150, bought:0, notes:'', isActive:true,
        lateCount:0, cancelCount:0, startDate:new Date().toISOString().slice(0,10),
        createdAt:new Date().toISOString() };
  students.push(s);
  DB_post({action:'upsert', sheet:'Students',
   row:[s.id,s.name,s.phone,s.lang,s.level,s.rate,s.bought,s.notes,'','',s.startDate,'','true',0,0,s.createdAt]}).catch(()=>{});
 }

 if(!lessons.find(l=>String(l.bookingId)===String(id))){
  const maxLid = lessons.reduce((m,x)=>Math.max(m,parseInt(x.id)||0),0);
  const l = { id:maxLid+1, studentId:s.id, studentName:s.name, lang:b.lang||'',
              date:b.date, time:fmtTime(b.time), price:s.rate||avDefaults.defaultRate||150,
              paid:false, status:'approved', bookingId:String(id), createdAt:new Date().toISOString() };
  lessons.push(l);
  DB_post({action:'upsert', sheet:'Lessons',
   row:[l.id,l.studentId,l.studentName,l.lang,l.date,l.time,l.price,'false','approved','','','','',
        '','',l.bookingId,l.createdAt]}).catch(()=>{});
 }

 toast('✅ אושר · הודעת אישור מוכנה לשליחה');
 renderList();
}

async function rejectBooking(id){
 const b = bookings.find(x=>String(x.id)===String(id));
 if(!b) return;
 b.status='cancelled';
 renderList();
 await DB_post({action:'updateBookingStatus', sheet:'Bookings', id:String(id), status:'cancelled'});
 toast('הבקשה נדחתה');
}

function sendWA(id,phone){
 if(!phone) return;
 const msg = document.getElementById('msgtext-'+id)?.value || '';
 const waPhone = '972'+normPhone(phone).slice(-9);
 window.open('https://api.whatsapp.com/send?phone='+waPhone+'&text='+encodeURIComponent(msg),'_blank');
}

function sendMail(id,name){
 const email = document.getElementById('email-'+id)?.value.trim();
 if(!email){ toast('הכנס כתובת אימייל תחילה'); return; }
 const msg = document.getElementById('msgtext-'+id)?.value || '';
 const subject = 'אישור שיעור — '+name;
 window.location.href = 'mailto:'+encodeURIComponent(email)+'?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(msg);
}

let _t;
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(_t); _t=setTimeout(()=>t.classList.remove('show'),2400); }
</script>
